     в двух местах ниже: стили в блоке «Иллюстрации: стили», код в блоке «Иллюстрации: код». -->
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Формулы: LaTeX, \( ... \) строчные и \[ ... \] выносные. Рендер MathJax 3, SVG.
  document.documentElement.classList.add("mj-wait");
  setTimeout(() => document.documentElement.classList.remove("mj-wait"), 3000);
  window.MathJax = {
    tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]], processEscapes: true },
    svg: { fontCache: "global", mtextInheritFont: true },
    options: {
      enableMenu: false,
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code", "annotation", "annotation-xml", "svg"]
    },
    startup: {
      typeset: false,
      ready() {
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(() => { window.__mjReady = true; if (window.onMathJaxReady) window.onMathJaxReady(); });
      }
    }
  };
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" onerror="document.documentElement.classList.remove('mj-wait')"></script>

      </button>
    </div>
    <ul class="chapter-list" id="chapter-list"></ul>
  </nav>

  <nav class="sections" id="sections" aria-label="Разделы главы">

    </div>
    <ul class="section-list" id="section-list"></ul>

  </nav>

  <main class="page" id="page">
    <article class="page-inner">

      <div id="section-body"></div>
